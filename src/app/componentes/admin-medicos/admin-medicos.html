<h3 class="mb-3">Administracion de medicos</h3>

<div class="card shadow-sm mb-4">
  <div class="card-body">
    <h5 class="card-title mb-3">
      {{ editandoId() ? 'Editar medico' : 'Nuevo medico' }}
    </h5>
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Nombre</label>
        <input type="text" class="form-control" [(ngModel)]="nombre" name="nombre">
      </div>
      <div class="col-md-6">
        <label class="form-label">Especialidad</label>
        <input type="text" class="form-control" [(ngModel)]="especialidad" name="especialidad">
      </div>
      <div class="col-md-4">
        <label class="form-label">Distrito</label>
        <input type="text" class="form-control" [(ngModel)]="distrito" name="distrito">
      </div>
      <div class="col-md-4">
        <label class="form-label">Sede</label>
        <input type="text" class="form-control" [(ngModel)]="sede" name="sede">
      </div>
      <div class="col-md-4">
        <label class="form-label">Calificacion</label>
        <input type="number" class="form-control" step="0.1" min="0" max="5"
               [(ngModel)]="calificacion" name="calificacion">
      </div>
    </div>
    <div class="mt-3 d-flex gap-2">
      <button class="btn btn-primary" [disabled]="!formularioValido" (click)="guardar()">
        {{ editandoId() ? 'Guardar cambios' : 'Agregar medico' }}
      </button>
      @if (editandoId()) {
        <button class="btn btn-outline-secondary" (click)="limpiar()">Cancelar</button>
      }
    </div>
  </div>
</div>

<table class="table table-striped shadow-sm bg-white align-middle">
  <thead class="table-dark">
    <tr>
      <th>Nombre</th>
      <th>Especialidad</th>
      <th>Distrito</th>
      <th class="text-end">Acciones</th>
    </tr>
  </thead>
  <tbody>
    @for (m of medicos(); track m.id) {
      <tr>
        <td>{{ m.nombre }}</td>
        <td>{{ m.especialidad }}</td>
        <td>{{ m.distrito }}</td>
        <td class="text-end">
          <button class="btn btn-sm btn-outline-primary me-2" (click)="editar(m)">Editar</button>
          <button class="btn btn-sm btn-outline-danger" (click)="eliminar(m.id)">Eliminar</button>
        </td>
      </tr>
    }
  </tbody>
</table>
